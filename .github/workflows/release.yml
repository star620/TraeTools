name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 拉取完整历史与所有 tag，供生成"上一版本→本版本"更新差异
          fetch-tags: true

      # P2-2：主程序已升到 net10.0-windows
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # P2-4：更新分发包改为「NativeAOT 目录版整包 zip」。
      # NativeAOT 产物不是单文件：libSkiaSharp / av_libglesv2 / e_sqlite3 / libHarfBuzzSharp /
      # libsodium 必须与 exe 同目录，只替换 exe 会得到"缺 DLL 打不开"的残废程序。
      # 应用内更新器（UpdaterService）现在下载 `TraeTools-win-x64.zip` → 校验 SHA-256 → 解包 →
      # 整套文件原子替换 → 重启；zip 压缩也抵消了 AOT 原生库带来的体积增长。
      # ⚠️ 主程序是双目标（net10.0-windows;net10.0-android），必须用 -f 限定框架：
      # 否则 -r win-x64 会渗入 android TFM 的还原，报 NU1102（找不到 Mono 的 win-x64 运行时包）。
      - name: Publish main (NativeAOT directory form)
        run: dotnet publish TraeTools.csproj -c Release -f net10.0-windows -r win-x64 --self-contained true -p:EnableAot=true -o publish_aot

      # 兼容引导包：历史客户端内的旧更新器只会下载名为 `TraeTools.exe` 的资产并替换自身。
      # 提供单文件自包含版（csproj 已开 PublishTrimmed=full，约 23MB），老客户端可一次性升到新版，
      # 之后其内置的新更新器会改走上面的 zip 整包。
      - name: Publish main (single-file bootstrap, legacy updater compatible)
        run: dotnet publish TraeTools.csproj -c Release -f net10.0-windows -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      # P2-1：登录宿主（WinForms + WebView2）是独立进程，不参与主程序的 NativeAOT，
      # 因此单独发布并随压缩包/Release 一起分发；缺失时主程序自动回退到"手动粘贴 Token"。
      - name: Publish login host (separate process, not AOT)
        run: dotnet publish TraeTools.LoginHost/TraeTools.LoginHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish_aot

      - name: Zip distribution (NativeAOT package, no PDBs)
        # 必须用 pwsh：Windows PowerShell 5.1 的 Compress-Archive 会把条目名里的目录分隔符写成
        # 反斜杠（实测 `a\b\z.pdb`），依赖"zip 内路径用 /"的解包器/校验器可能踩坑。
        shell: pwsh
        run: |
          Copy-Item publish_aot\TraeTools.LoginHost.exe publish\ -Force
          Get-ChildItem -Path publish_aot -Recurse -Include *.pdb | Remove-Item -Force
          Compress-Archive -Path publish_aot\* -DestinationPath TraeTools-win-x64.zip -Force
          Get-ChildItem -Path publish, publish_aot, TraeTools-win-x64.zip | Select-Object Name, Length

      # 自动生成更新摘要：取「版本号不大于当前版本」的最近一个 v* tag，
      # 汇总其到本版本之间的全部提交（跳过 merge 提交）。
      # 注意：仓库保留着重构前的历史 tag（如 v1.5.2.1），必须排除版本号大于当前的，否则会选错上一版本。
      - name: Generate release notes
        shell: bash
        run: |
          set -e
          CUR="${GITHUB_REF_NAME#v}"
          PREV=""
          for t in $(git tag --list 'v*' --sort=-version:refname); do
            v="${t#v}"
            [ "$v" = "$CUR" ] && continue
            # 四段式版本比较（v1.0.2.2 / v1.0.3）
            gt=0
            IFS=. read -ra A <<< "$v"; IFS=. read -ra B <<< "$CUR"
            for i in 0 1 2 3; do
              x=${A[$i]:-0}; y=${B[$i]:-0}
              if (( x > y )); then gt=1; break; fi
              if (( x < y )); then break; fi
            done
            [ "$gt" = "1" ] && continue   # 大于当前版本（历史遗留超前 tag）跳过
            PREV="$t"; break
          done
          {
            echo "TraeTools ${GITHUB_REF_NAME}"
            echo ""
            echo "- Windows x64：\`TraeTools-win-x64.zip\`（NativeAOT 整包，解压运行，无需安装 .NET 运行时）"
            echo "- 应用内「检查更新」会下载本 Release 的 \`TraeTools-win-x64.zip\`，校验后自动替换整套文件并重启"
            echo "- \`TraeTools.exe\` 为单文件引导包，仅用于老版本客户端首次升级"
            echo ""
            if [ -n "${PREV}" ]; then
              echo "## 更新差异（${PREV} → ${GITHUB_REF_NAME}）"
              echo ""
              git log --oneline --no-merges "${PREV}..HEAD" || true
              echo ""
              echo "> 由提交记录自动生成，完整变更请查看 Commits"
            else
              echo "（未找到上一版本 tag，此为首个版本）"
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TraeTools ${{ github.ref_name }}"
          body_path: release_notes.md
          files: |
            publish/TraeTools.exe
            publish/TraeTools.LoginHost.exe
            TraeTools-win-x64.zip
          generate_release_notes: false